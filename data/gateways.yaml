    deployment_method: "Local desktop or mobile application installed on merchant device"
    spend_key_control: "Merchant device (or offline cold wallet when paired with a view-only hot wallet)"
    view_key_control: "Merchant device only"
    node_rpc_requirements: "Local or remote monerod node (no monero-wallet-rpc required for interactive GUI use)"
    price_conversion: "Built-in fiat display in Merchant/Receive views (varies by wallet client)"
    invoices: "Manual subaddress creation and standard monero: URI QR code generation (tx_amount, recipient_name, tx_description)"
    confirmation_policy: "Visual mempool (0-conf) detection and block confirmation counter inspected by cashier"
