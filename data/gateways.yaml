  - id: "monkstash-pay"
    name: "MonkStash Pay"
    repo_url: "https://github.com/90ssolo/monkstash/tree/main/apps/pay"
    website_url: "https://monkstash.com/monero-payment-gateway"
    category: "self_hosted_server"
    category_label: "Self-Hosted Payment Server"
    license: "BSD-3-Clause"
    development_status: "In testing (v0.1.0 in public repository; paired with WooCommerce plugin)"
    affiliation_note: "Maintained by the MonkStash project (author of this catalogue)"
    deployment_method: "Self-hosted Docker container or Node.js 22+ process with JSON persistence (no external database required)"
    spend_key_control: "Merchant only (spend key never touches the server)"
    view_key_control: "Merchant's own server (configured via PAY_ADDRESS and PAY_VIEW_KEY)"
    node_rpc_requirements: "Connects directly to a Monero node (monerod via PAY_NODE_URL) using monero-ts WASM; does not require a separate monero-wallet-rpc service"
    price_conversion: "Yes (25+ currencies; median of Bitfinex, Kraken, KuCoin with CoinGecko fallback and ECB reference rates; locked for 30 mins by default)"
    invoices: "Dedicated wallet account (PAY_ACCOUNT=1 by default) with unique subaddress per invoice, hosted checkout page, 3-minute expiry grace period, and subaddress lookahead gap monitoring (GET /api/health)"
    confirmation_policy: "Configurable via PAY_CONFIRMATIONS: quick (0-conf <= 0.1 XMR, 1-conf <= 1 XMR, 10-conf > 1 XMR), standard (1-conf <= 5 XMR, 10-conf > 5 XMR), safe (10-conf)"
    partial_payments: "Supported (tracks received, remaining, and overpaid amounts; emits invoice.partial and prompts customer for remaining balance until expiry)"
    webhooks: "HMAC-SHA256 signed webhooks (X-MonkStash-Signature) with 6 retry attempts for invoice.confirming, invoice.paid, invoice.partial, invoice.late, invoice.expired, and invoice.reverted"
    exports: "JSON invoice store (invoices.json with automatic backup) and REST API (GET /api/invoices/:id); no separate admin export UI in v0.1"
    ecommerce_integrations:
      - "WooCommerce (integrations/woocommerce in monorepo)"
      - "JSON REST API (POST /api/invoices)"
    matrix:
      category: "Payment Server"
      custody: "Non-custodial (View-only)"
      node_req: "monerod only (via WASM)"
      fiat: "Yes (25+ currencies)"
      partial: "Yes"
      webhooks: "Signed HMAC"
      exports: "JSON / REST API"
    evidence:
      checked_date: "2026-10-17"
      source_urls:
        - "https://github.com/90ssolo/monkstash/blob/main/apps/pay/README.md"
        - "https://monkstash.com/monero-payment-gateway"
        - "https://monkstash.com/monero-woocommerce"
      notes: "Includes explicit subaddress lookahead gap tracking in GET /api/health and emits invoice.reverted if a 0-conf payment drops from the mempool."

