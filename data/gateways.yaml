    partial_payments: "Supported (reports covered.total vs. expected amount in callbacks and GET /receive/:address)"
    webhooks: "HTTP POST callback to callback_url specified when creating the payment request"
    exports: "unknown (Database-backed persistence in PostgreSQL/SQLite; no built-in CSV export endpoint documented in core API)"
    ecommerce_integrations:
      - "WooCommerce (community plugin)"
      - "PrestaShop"
      - "REST API"
    matrix:
      category: "Payment Server"
      custody: "Non-custodial (View-only)"
      node_req: "monerod + wallet-rpc"
      fiat: "Plugin-handled"
      partial: "Yes"
