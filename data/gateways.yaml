name: "Awesome Monero Payments"
description: "A researched, evidence-based catalogue comparing Monero (XMR) payment gateways, self-hosted checkout servers, browser tills, CMS plugins, and payment libraries."
last_updated: "2026-10-17"

gateways:
  - id: "monkstash-pos"
    name: "MonkStash Browser Till & Payment Links"
    repo_url: "https://github.com/90ssolo/monkstash"
    website_url: "https://monkstash.com/business"
    category: "browser_till"
    category_label: "Browser Till & Client-Side Payment Links"
    license: "BSD-3-Clause"
    development_status: "Live (Browser wallet, till, and payment links are live; self-hosted Pay server listed separately below)"
    affiliation_note: "Maintained by the MonkStash project (author of this catalogue)"
    deployment_method: "Runs in the browser (hosted at wallet.monkstash.com or self-hosted via Docker/Next.js)"
    spend_key_control: "Merchant only (optional view-only wallet mode on counter tablets so staff cannot spend)"
    view_key_control: "Merchant device only (encrypted in browser via Web Crypto AES-256-GCM; never sent to a server)"
    node_rpc_requirements: "monero-ts (WebAssembly) in browser via node relay or merchant's own monerod node (no monero-wallet-rpc required)"
    price_conversion: "Yes (25+ fiat currencies converted to XMR; rate and source recorded on each sale)"
    invoices: "Fresh subaddress per sale; multi-till support (accounts 1-8 so up to 8 tills never reuse addresses); URL-fragment payment links (/pay#...)"
    confirmation_policy: "Configurable presets: quick (0-conf up to 0.1 XMR, 1-conf up to 1 XMR, 10-conf above), standard (1-conf up to 5 XMR, 10-conf above), safe (10-conf)"
    partial_payments: "Supported (tracks amount received vs. remaining balance due and overpayments per subaddress)"
    webhooks: "Not applicable (client-side browser till and shareable payment links; see MonkStash Pay for server webhooks)"
    exports: "Built-in client-side CSV exports for cashier sales, payment requests, and wallet history (UTF-8 BOM for spreadsheet compatibility)"
    ecommerce_integrations:
      - "In-person counter till (tablet/phone)"
      - "Shareable invoice links (/pay# fragment)"
    matrix:
      category: "Browser Till & Links"
      custody: "Non-custodial (Client)"
      node_req: "monerod (direct or relay)"
      fiat: "Yes (25+ currencies)"
      partial: "Yes"
      webhooks: "N/A (Client)"
      exports: "CSV (Sales/Requests)"
    evidence:
      checked_date: "2026-10-17"
      source_urls:
        - "https://github.com/90ssolo/monkstash/blob/main/README.md"
        - "https://monkstash.com/monero-pos"
        - "https://monkstash.com/monero-payment-link"
      notes: "Payment link parameters are stored in the URL fragment (#), which browsers do not transmit to HTTP servers."

